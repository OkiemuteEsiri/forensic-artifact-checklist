name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile package
        run: python -m compileall src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic CLI smoke test
        run: python -m src.cli data/synthetic_case.json --output /tmp/forensic-artifact-assessment.md
